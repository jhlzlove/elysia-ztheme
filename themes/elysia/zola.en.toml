# Zola configuration — Elysia Theme (English template)
# Copy to zola.toml if your primary language is English, or compare with zola.toml
# Note: default_language = "en" → Chinese content files should be named `*.zh.md`
#       (e.g. content/blog/post.zh.md) while English is `*.md` (no suffix).
#       The included content/ uses default zh, so `zola -c zola.en.toml check`
#       will report collisions until you rename per above.
base_url = "https://example.com"
title = "Elysia"
description = "A modern, minimalist Zola theme — Reading is enjoyment."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]
minify_html = false

taxonomies = [
    {name = "categories", feed = true, paginate_by = 12, paginate_path = "page"},
    {name = "tags", feed = true, paginate_by = 12, paginate_path = "page"},
]

[markdown]
render_emoji = true
github_alerts = true
bottom_footnotes = true

[markdown.highlighting]
theme = "catppuccin-mocha"
style = "class"

[extra]
# ── Site Identity ──
avatar = "/avatar.svg"
avatar_alt = "Elysia"
site_motto = "Reading is enjoyment."
# Welcome (markdown supported)
welcome = """
> **Hello, welcome to Elysia!**
>
> Writing and sharing, may reading be a pleasure.
"""

# Footer (markdown supported)
footer = "© 2026 Elysia · Powered by [Zola](https://www.getzola.org) · Theme [Elysia](https://github.com/)"

# ── Top Navigation Buttons (wrap automatically) ──
# icon can be emoji / svg name / url
[[extra.menus]]
name = "Blog"
url = "/"
icon = "✍️"

[[extra.menus]]
name = "Wiki"
url = "/wiki/"
icon = "📚"

[[extra.menus]]
name = "Archive"
url = "/archive/"
icon = "🗂️"

[[extra.menus]]
name = "Categories"
url = "/categories/"
icon = "📁"

[[extra.menus]]
name = "Tags"
url = "/tags/"
icon = "🏷️"

[[extra.menus]]
name = "Heatmap"
url = "/heatmap/"
icon = "🔥"

[[extra.menus]]
name = "Links"
url = "/links/"
icon = "🔗"

# ── Social Icons (bottom) ──
[[extra.socials]]
name = "GitHub"
url = "https://github.com"
icon = "github"

[[extra.socials]]
name = "RSS"
url = "/atom.xml"
icon = "rss"

[[extra.socials]]
name = "Email"
url = "mailto:hello@example.com"
icon = "mail"


# ── Fonts ──
# Leave url empty to use system fonts
# Sizes support any CSS length (px, rem, em)
[extra.fonts]
body_name = "LXGW WenKai Screen"
body_url = "https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-web/style.css"
body_size = "16px"
body_size_small = "15px"
code_name = "JetBrains Mono"
code_url = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
code_size = "16px"
article_size = "16px"
toc_size = "13.5px"

# ── Style / Palette defaults ──
# theme: "auto" | "light" | "dark"
[extra.style]
default_theme = "auto"
# palette: "default" | "lime" | "orange" | "violet"
default_palette = "default"

# ── Comments ──
# enable in [extra.comments]; provider: "giscus" | "artalk" | "waline" | "none"
[extra.comments]
enable = true
provider = "giscus"
comment_title = "Comments — share your thoughts"

# ── Giscus ──
[extra.giscus]
repo = "user/repo"
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
theme = "preferred_color_scheme"
lang = "en"
loading = "lazy"

# ── Artalk ── https://artalk.js.org
[extra.artalk]
server = ""
site = ""
placeholder = ""
no_comment = ""
emit_own = false
page_key = ""
gravatar_mirror = ""
avatar_mirror = ""

# ── Waline ── https://waline.js.org
[extra.waline]
serverURL = ""
lang = "en"
dark = "auto"
emoji = ["https://unpkg.com/@waline/emojis@1.1.0/bilibili"]
meta = ["nick", "mail", "link"]
requiredMeta = ["nick", "mail"]
login = "false"
placeholder = ""

# ── Algolia Search ──
[extra.algolia]
enable = true
app_id = ""
api_key = ""
index_name = ""
hits_per_page = 8
placeholder = "Search posts..."
show_powered_by = true

# ── Features ──
[extra.features]
year_progress = true
toc = true
code_copy = true
code_line_numbers = true
paginate_by = 5
show_reading_time = true

# ── KaTeX ── enable = true to support $...$ / $$...$$
[extra.katex]
enable = false
# css_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
# js_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
# auto_render_url = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"

[languages.zh]
title = "Elysia 中文"
description = "现代简洁的 Zola 博客主题 — 阅读就是享受"
generate_feeds = true
taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"
