name: ci

# On every push this script is executed
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@master
        env:
          BUILD_ONLY: true

      - name: Fix public permissions
        run: |
          chmod -R u+rwX public

      - name: Encrypt private content
        uses: jhlzlove/ssg-encrypt@main
        with:
          selector: "#encryptedBox"
          content-selector: "#articleContent"
        env:
          SITE_ENCRYPT_PASSWORDS: ${{ secrets.ENCRYPT_PASSWORDS }}

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
